<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OXXO Maps Pachuca | Base de Datos y API</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, 'Segoe UI', Arial, sans-serif; color: #162134; background: #f4f7fa; }
    .app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; min-height: 520px; }
    aside { display: flex; flex-direction: column; min-height: 0; background: #fff; box-shadow: 2px 0 20px #00000010; z-index: 1; }
    header { padding: 22px 18px 14px; background: #d31c32; color: white; }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 5px 0 0; opacity: .94; font-size: 12px; }
    .panel { padding: 16px 17px; }
    label { display: block; font-size: 12px; font-weight: 650; margin: 10px 0 7px; }
    input[type="text"], select { width: 100%; height: 40px; border: 1px solid #d2dbe6; padding: 8px 10px; border-radius: 8px; font: inherit; background: #fff; }
    button { width: 100%; padding: 11px 10px; border: 0; border-radius: 8px; background: #d31c32; color: white; font-weight: 700; cursor: pointer; margin-top: 12px; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .checkrow { display: flex; gap: 8px; align-items: center; font-size: 12px; margin-top: 14px; cursor: pointer; }
    .checkrow input { accent-color: #d31c32; }
    .summary { padding: 11px 16px; font-size: 13px; background: #f5f7fa; border-top: 1px solid #eef0f4; border-bottom: 1px solid #eef0f4; }
    .summary b { font-size: 22px; color: #d31c32; }
    .results { flex: 1; min-height: 0; overflow: auto; padding: 6px 12px 16px; }
    .result { width: 100%; margin: 9px 0 0; padding: 11px; border: 1px solid #e1e5ec; border-radius: 9px; background: white; text-align: left; color: #162134; cursor: pointer; font-weight: 500; }
    .result:hover { background: #f8f8fa; border-color: #c9d2df; }
    .result strong { display: block; margin-bottom: 4px; }
    .result span { display: block; font-size: 12px; color: #64748b; font-weight: 400; line-height: 1.45; }
    #map { width: 100%; height: 100%; }
    .fine { font-size: 11px; line-height: 1.45; color: #657084; margin-top: 12px; }
    #status { font-size: 12px; margin-top: 10px; color: #334155; min-height: 16px; }
    @media(max-width: 760px) { .app { grid-template-columns: 1fr; grid-template-rows: minmax(345px, 52vh) minmax(360px, 48vh); height: 100vh; } aside { grid-row: 2; } #map { grid-row: 1; } header { padding: 12px 18px; } .panel { padding: 10px 16px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <header><h1>OXXO Maps Pachuca</h1><p>Conectado a API Flask y MongoDB Atlas</p></header>
      <div class="panel">
        <label for="query">Buscar establecimiento</label>
        <input type="text" id="query" value="OXXO" maxlength="70" aria-label="Nombre de comercio">
        <label class="checkrow" for="openNow"><input type="checkbox" id="openNow"> Mostrar solo abiertos según Mapbox</label>
        <button id="searchButton" type="button">Buscar en Mapbox</button>
        <div id="status" role="status"></div>
        <p class="fine">Visualización integrada de sucursales desde base de datos propia y Mapbox Search Box.</p>
      </div>
      <div class="summary"><b id="count">—</b> <span id="countLabel">resultados de esta consulta</span></div>
      <div class="results" id="results"></div>
    </aside>
    <div id="map" role="region" aria-label="Mapa interactivo de Pachuca"></div>
  </div>

  <script>
    const TOKEN = 'pk.aqui_va_tu_token_publico_de_mapbox';
    const STYLE = 'mapbox://styles/alexd500/cmv73dsal00ko01s71tyb26sm';
    const PACHUCA = [-98.7333, 20.117];
    const BBOX = '-98.86,20.05,-98.63,20.20';

    const status = document.getElementById('status');
    const searchButton = document.getElementById('searchButton');
    let markers = [];
    let map = null;

    function tell(message) { status.textContent = message; }
    function clearMarkers() { markers.forEach(marker => marker.remove()); markers = []; }

    // 1. Función para buscar en Mapbox Search Box API
    async function buscar() {
      if (!TOKEN.startsWith('pk.')) {
        tell('Falta configurar tu token público de Mapbox.');
        return;
      }
      const q = document.getElementById('query').value.trim();
      if (!q) { tell('Escribe un término de búsqueda.'); return; }
      searchButton.disabled = true;
      tell('Buscando en Mapbox...');
      document.getElementById('results').replaceChildren();
      document.getElementById('count').textContent = '—';
      clearMarkers();
      
      const url = new URL('https://api.mapbox.com/search/searchbox/v1/forward');
      url.searchParams.set('q', q);
      url.searchParams.set('access_token', TOKEN);
      url.searchParams.set('country', 'MX');
      url.searchParams.set('types', 'poi');
      url.searchParams.set('limit', '10');
      url.searchParams.set('language', 'es');
      url.searchParams.set('proximity', PACHUCA.join(','));
      url.searchParams.set('bbox', BBOX);
      if (document.getElementById('openNow').checked) url.searchParams.set('open_now', 'true');

      try {
        const response = await fetch(url.toString(), { cache: 'no-store' });
        if (!response.ok) throw new Error('API HTTP ' + response.status);
        const data = await response.json();
        const features = (data.features || []).filter(f =>
          f.geometry && f.geometry.type === 'Point' &&
          Array.isArray(f.geometry.coordinates) &&
          Number.isFinite(f.geometry.coordinates[0]) && Number.isFinite(f.geometry.coordinates[1])
        );
        document.getElementById('count').textContent = features.length;
        document.getElementById('countLabel').textContent = 'resultados de Mapbox';
        tell(features.length ? 'Selecciona un resultado para centrar el mapa.' : 'No se encontraron resultados.');
        
        const list = document.getElementById('results');
        features.forEach((feature, i) => {
          const p = feature.properties || {};
          const name = p.name || q;
          const address = p.full_address || p.address || p.place_formatted || 'Dirección no disponible';
          const marker = new mapboxgl.Marker({ color: '#d31c32' })
            .setLngLat(feature.geometry.coordinates)
            .addTo(map);
          markers.push(marker);
          
          const popupContent = document.createElement('div');
          const bold = document.createElement('strong'); bold.textContent = name;
          const addressNode = document.createElement('div'); addressNode.textContent = address;
          popupContent.append(bold, addressNode);
          marker.setPopup(new mapboxgl.Popup({ offset: 18 }).setDOMContent(popupContent));
          
          const item = document.createElement('button'); item.type = 'button'; item.className = 'result';
          const title = document.createElement('strong'); title.textContent = `${i + 1}. ${name}`;
          const text = document.createElement('span'); text.textContent = address;
          item.append(title, text);
          item.addEventListener('click', () => { map.flyTo({ center: feature.geometry.coordinates, zoom: 15 }); marker.togglePopup(); });
          list.appendChild(item);
        });
      } catch (error) {
        tell('Error en Mapbox: ' + error.message);
      } finally {
        searchButton.disabled = false;
      }
    }

    // 2. Función para cargar las sucursales desde tu API Flask (MongoDB Atlas)
    async function cargarSucursalesDesdeAPI() {
      try {
        const response = await fetch('http://127.0.0.1:5000/api/sucursales');
        const sucursales = await response.json();

        sucursales.forEach(sucursal => {
          // MongoDB / GeoJSON usan [Longitud, Latitud]
          if (sucursal.coordinates && sucursal.coordinates.length === 2) {
            const lng = sucursal.coordinates[0];
            const lat = sucursal.coordinates[1];

            // Crear un marcador especial para tus sucursales de base de datos
            const dbMarker = new mapboxgl.Marker({ color: '#2b580c' }) // Verde para distinguir las de BD
              .setLngLat([lng, lat])
              .setPopup(
                new mapboxgl.Popup({ offset: 25 })
                  .setHTML(`
                    <h3 style="margin:0; font-family:sans-serif; color:#d31c32;">${sucursal.nombre}</h3>
                    <p style="margin:4px 0 0; font-size:12px;">${sucursal.direccion}</p>
                    <p style="margin:4px 0 0; font-size:11px; color:#666;">Horario: ${sucursal.horario}</p>
                  `)
              )
              .addTo(map);
            markers.push(dbMarker);
          }
        });
        console.log("Sucursales de MongoDB cargadas correctamente en el mapa.");
      } catch (error) {
        console.error('Error al conectar con la API Flask de MongoDB:', error);
      }
    }

    searchButton.addEventListener('click', buscar);
    document.getElementById('query').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });

    // Inicialización del mapa
    if (TOKEN.startsWith('pk.')) {
      mapboxgl.accessToken = TOKEN;
      map = new mapboxgl.Map({ container: 'map', style: STYLE, center: PACHUCA, zoom: 12 });
      map.addControl(new mapboxgl.NavigationControl());
      
      // Al cargar el mapa, ejecutamos la búsqueda inicial y cargamos los datos de MongoDB
      map.on('load', () => {
        buscar();
        cargarSucursalesDesdeAPI();
      });
      
      map.on('error', e => { if (e.error) console.warn('Mapbox:', e.error.message); });
    } else {
      tell('Falta configurar el token público de Mapbox.');
      document.getElementById('map').style.background = 'linear-gradient(145deg,#dce7f1,#f8fafc)';
    }
  </script>
</body>
</html>
